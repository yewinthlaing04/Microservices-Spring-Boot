server:
  port: 8071

spring:
  application:
    name: "configserver"
  profiles:
    active: git
   # active: native for classpath
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/yewinthlaing04/config-yml.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"
#        native:
#          search-location: "classpath:/config"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true